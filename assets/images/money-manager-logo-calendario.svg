<svg width="380" height="380" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Logo Money Manager - moneda calendario</title>
<desc>Ícono circular partido en dos: la mitad izquierda es una moneda dorada con símbolo de dólar, la mitad derecha se transforma en una cuadrícula de calendario, sobre fondo cuadrado redondeado con degradado índigo a violeta</desc>
<defs>
<linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#4834D4"/>
<stop offset="100%" stop-color="#6C5CE7"/>
</linearGradient>
<linearGradient id="coinGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFD873"/>
<stop offset="100%" stop-color="#F0A93C"/>
</linearGradient>
<clipPath id="leftHalf">
<rect x="60" y="60" width="130" height="260"/>
</clipPath>
<clipPath id="rightHalf">
<rect x="190" y="60" width="130" height="260"/>
</clipPath>
</defs>

<rect x="40" y="40" width="300" height="300" rx="66" fill="url(#bgGrad2)"/>

<g clip-path="url(#leftHalf)">
<circle cx="190" cy="190" r="98" fill="url(#coinGrad2)"/>
<circle cx="190" cy="190" r="82" fill="none" stroke="#D98B1F" stroke-width="2" opacity="0.55"/>
<text x="150" y="204" font-size="46" font-weight="500" fill="#B5730F" font-family="Arial, sans-serif">$</text>
</g>

<g clip-path="url(#rightHalf)">
<circle cx="190" cy="190" r="98" fill="#FBFAFF"/>
<rect x="192" y="128" width="8" height="20" rx="2" fill="#6C5CE7"/>
<rect x="222" y="128" width="8" height="20" rx="2" fill="#6C5CE7"/>
<rect x="196" y="150" width="72" height="82" rx="6" fill="none" stroke="#4834D4" stroke-width="2.5"/>
<line x1="196" y1="168" x2="268" y2="168" stroke="#4834D4" stroke-width="2.5"/>
<rect x="206" y="178" width="12" height="12" rx="2" fill="#D6D0FA"/>
<rect x="224" y="178" width="12" height="12" rx="2" fill="#D6D0FA"/>
<rect x="242" y="178" width="12" height="12" rx="2" fill="#D6D0FA"/>
<rect x="206" y="198" width="12" height="12" rx="2" fill="#D6D0FA"/>
<rect x="224" y="198" width="12" height="12" rx="2" fill="#27AE60"/>
<rect x="242" y="198" width="12" height="12" rx="2" fill="#D6D0FA"/>
</g>

<circle cx="190" cy="190" r="98" fill="none" stroke="#FBFAFF" stroke-width="3"/>
<line x1="190" y1="92" x2="190" y2="288" stroke="#FBFAFF" stroke-width="3"/>

<circle cx="78" cy="78" r="8" fill="#FFFFFF" opacity="0.16"/>
<circle cx="304" cy="304" r="12" fill="#FFFFFF" opacity="0.12"/>
</svg>
